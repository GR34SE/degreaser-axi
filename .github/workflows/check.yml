name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - id: plan
        name: Select conservative PR scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/ci-plan.ts

  # CI_LINUX_RUNNER and CI_MACOS_RUNNER repository variables may name
  # self-hosted runner labels; unset, jobs use GitHub-hosted runners. Each PR
  # takes one macOS job, because macOS hosts run at most two VMs. Fork PRs
  # always use GitHub-hosted runners. Linux runs the same runtime suite.
  linux:
    name: Linux checks
    needs: plan
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up minimum Node for full acceptance
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.0.0"
          package-manager-cache: false
      - name: Retain minimum Node path
        if: github.event_name != 'pull_request'
        run: echo "DEGREASER_NODE24_MIN=$(node -p process.execPath)" >> "$GITHUB_ENV"
      # Node comes first: the pnpm installer runs node, and self-hosted
      # runners need not provide it.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Initialize disposable runner Git identity
        run: |
          if ! git config user.name >/dev/null; then
            git config --global user.name 'github-actions[bot]'
          fi
          if ! git config user.email >/dev/null; then
            git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fi
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: build
        name: Build and check generated-skill drift
        run: pnpm build
      - name: Documentation contracts
        if: needs.plan.outputs.scope == 'documentation'
        run: node --test --test-concurrency=4 test/docs/documentation.test.ts
      - name: Runtime regression suite
        if: needs.plan.outputs.scope == 'full'
        run: node test/run.ts --test-concurrency=4
      - name: Live tooling regression suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.plan.outputs.scope == 'full' }}
        run: pnpm test:tooling
      # Run after a test failure too, so one PR run reports both results.
      - name: Typecheck and lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm typecheck && pnpm lint
      - name: Installed package on current Node (PR)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'pull_request' }}
        run: node test/package/check.ts --current-node-only
      - name: Installed package on minimum and current Node (full acceptance)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name != 'pull_request' }}
        run: node test/package/check.ts

  macos:
    name: macOS runtime
    needs: plan
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up minimum Node for full acceptance
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.0.0"
          package-manager-cache: false
      - name: Retain minimum Node path
        if: github.event_name != 'pull_request'
        run: echo "DEGREASER_NODE24_MIN=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - name: Set up current Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Initialize disposable runner Git identity
        run: |
          if ! git config user.name >/dev/null; then
            git config --global user.name 'github-actions[bot]'
          fi
          if ! git config user.email >/dev/null; then
            git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fi
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: build
        name: Build once for this job
        run: pnpm build
      - name: Documentation contracts
        if: needs.plan.outputs.scope == 'documentation'
        run: node --test --test-concurrency=4 test/docs/documentation.test.ts
      - name: Runtime regression suite
        if: needs.plan.outputs.scope == 'full'
        run: node test/run.ts --test-concurrency=4
      - name: Live tooling regression suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.plan.outputs.scope == 'full' }}
        run: pnpm test:tooling
      # Run after a test failure too, so one PR run reports both results.
      - name: Installed package on current Node (PR)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'pull_request' }}
        run: node test/package/check.ts --current-node-only
      - name: Installed package on minimum and current Node (full acceptance)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name != 'pull_request' }}
        run: node test/package/check.ts

  check:
    name: macOS deterministic
    if: always()
    needs: [plan, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every selected job to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: test "$PLAN_RESULT" = success && test "$LINUX_RESULT" = success && test "$MACOS_RESULT" = success
