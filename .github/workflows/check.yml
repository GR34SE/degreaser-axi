name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - id: plan
        name: Select conservative PR scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-plan.ts

  validate:
    name: macOS ${{ matrix.lane }} ${{ matrix.shard }}
    needs: plan
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up minimum Node for full acceptance
        if: matrix.lane == 'package' && github.event_name != 'pull_request'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.0.0"
          package-manager-cache: false
      - name: Retain minimum Node path
        if: matrix.lane == 'package' && github.event_name != 'pull_request'
        run: echo "DEGREASER_NODE24_MIN=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up current Node 24 and dependency cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Initialize disposable runner Git identity
        run: |
          if ! git config user.name >/dev/null; then
            git config --global user.name 'github-actions[bot]'
          fi
          if ! git config user.email >/dev/null; then
            git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fi
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build once for this lane
        run: pnpm build
      - name: Typecheck and lint
        if: matrix.lane == 'static'
        run: pnpm typecheck && pnpm lint
      - name: Documentation contracts
        if: matrix.lane == 'tests' && needs.plan.outputs.scope == 'documentation'
        run: node --test --test-concurrency=2 test/documentation.test.ts
      - name: Runtime regression shard
        if: matrix.lane == 'tests' && needs.plan.outputs.scope == 'full'
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: node --test --test-concurrency=2 --test-shard="$TEST_SHARD" test/*.test.ts
      - name: Installed package on current Node (PR)
        if: matrix.lane == 'package' && github.event_name == 'pull_request'
        run: node scripts/package-check.ts --current-node-only
      - name: Installed package on minimum and current Node (full acceptance)
        if: matrix.lane == 'package' && github.event_name != 'pull_request'
        run: node scripts/package-check.ts

  check:
    name: macOS deterministic
    if: always()
    needs: [plan, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every selected lane to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: test "$PLAN_RESULT" = success && test "$VALIDATE_RESULT" = success
