name: Release

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to recover (empty runs Release Please)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        if: inputs.tag == ''
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Enable checked auto-merge for release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          while read -r number; do
            gh pr merge "$number" --repo "$GH_REPO" --auto --squash
          done < <(jq -r '.[].number' <<< "$RELEASE_PRS")
      - name: Select a new or explicitly recovered draft
        id: tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then exit 0; fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft')" = true
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  prepare:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI: "true"
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag belongs to main and matches the package
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          assert.equal(pkg.private, false);
          NODE
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.0.0"
          package-manager-cache: false
      - name: Retain minimum Node path
        run: echo "DEGREASER_NODE24_MIN=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Initialize disposable runner Git identity
        run: |
          if ! git config user.name >/dev/null; then
            git config --global user.name 'github-actions[bot]'
          fi
          if ! git config user.email >/dev/null; then
            git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fi
      - name: Validate the exact release commit
        run: pnpm test && pnpm typecheck && pnpm lint
      - name: Test and retain the tarball on minimum and current Node
        run: node test/package/check.ts --pack-destination "$RUNNER_TEMP/release"
      - name: Check publication without publishing
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          shasum -a 256 ./*.tgz > SHA256SUMS
          npm publish ./*.tgz --dry-run --access public --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-${{ needs.release.outputs.tag }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [release, prepare]
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      NODE_AUTH_TOKEN: ""
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-${{ needs.release.outputs.tag }}
          path: release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify the tested tarball
        run: cd release && sha256sum -c SHA256SUMS
      - name: Check for an already published identical artifact
        id: registry
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {appendFileSync, readFileSync} from 'node:fs';
          const version = process.env.RELEASE_TAG.slice(1);
          const response = await fetch(`https://registry.npmjs.org/degreaser-axi/${version}`);
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n');
          } else {
            assert.equal(response.ok, true, `npm registry returned ${response.status}`);
            const published = await response.json();
            const bytes = readFileSync(`release/degreaser-axi-${version}.tgz`);
            const integrity = `sha512-${createHash('sha512').update(bytes).digest('base64')}`;
            assert.equal(published.dist.integrity, integrity, 'Existing npm version has different bytes.');
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=false\n');
          }
          NODE
      - name: Publish the tested tarball using npm Trusted Publishing
        if: steps.registry.outputs.publish == 'true'
        run: npm publish "release/degreaser-axi-${RELEASE_TAG#v}.tgz" --access public --provenance --ignore-scripts

  finalize:
    needs: [release, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-${{ needs.release.outputs.tag }}
          path: release
      - name: Publish the GitHub release only after npm succeeds
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          test "$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft')" = true
          gh release upload "$RELEASE_TAG" ./*.tgz SHA256SUMS --repo "$GH_REPO" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest
